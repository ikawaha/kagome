name: Go

on:
  push:
    branches:
      - v2
  pull_request:
    types: [opened, synchronize]
    paths:
    - '**.go'
    - 'go.mod'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go 1.x
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Remove symlink 2to3
        if: matrix.os == 'macos-latest'
        run: |
          : # Workaround GitHub Actions Python issues
          : # https://github.com/Homebrew/homebrew-core/issues/165793#issuecomment-1989441193
          brew unlink python && brew link --overwrite python

      - name: Set up Graphviz
        uses: ts-graphviz/setup-graphviz@b1de5da23ed0a6d14e0aeee8ed52fdd87af2363c # v2.0.2

      - name: Build
        run: go build -v ./...

      - name: Test
        run: |
          go test -v ./...
          cd tokenizer; go test -benchmem -bench .; cd ..

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go 1.x
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install goveralls
        run: go install github.com/mattn/goveralls@latest
      - name: Coverage
        continue-on-error: true
        run: |
          go test -v -coverprofile=profile.cov -covermode=atomic ./...
          goveralls -coverprofile=profile.cov -service=github
        env:
          COVERALLS_TOKEN: ${{ github.token }}
